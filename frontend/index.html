<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cloud DevOps Assessment</title>
    <script src="config.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
      input, button { padding: 10px; font-size: 16px; }
      input { width: 60%; }
      li { margin: 8px 0; }
      .status { padding: 8px 12px; border-radius: 8px; background: #eee; display: inline-block; }
    </style>
  </head>
  <body>
    <h1>Cloud / DevOps Assessment</h1>
    <p id="status" class="status">Checking API…</p>
    <h2>Items</h2>
    <form id="item-form">
      <input id="name" maxlength="100" required placeholder="Example item" />
      <button type="submit">Add</button>
    </form>
    <ul id="items"></ul>
    <script src="app.js"></script>
  </body>
</html>
